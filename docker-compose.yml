services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: projectacademy
      POSTGRES_USER: projectacademy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - projectacademy_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectacademy -d projectacademy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  projectacademy_db:
